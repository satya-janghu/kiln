# golangci-lint v2. Static analysis is kiln's only mechanical check (D34).
version: "2"

run:
  timeout: 5m

linters:
  # "standard" = errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - bodyclose     # unclosed HTTP response bodies (mirrors, downloads)
    - errorlint     # errors.Is/As instead of == and type assertions
    - gosec         # command injection, file permissions, weak randomness
    - misspell
    - nilerr        # returning nil after checking err != nil
    - noctx         # HTTP requests without a context (every network call needs a timeout)
    - unconvert
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment # struct layout noise; readability wins here
    errcheck:
      check-type-assertions: true
  exclusions:
    rules:
      # kiln reads system paths by design (sysfs, /etc, /var/lib); paths never come from untrusted input.
      - linters: [gosec]
        text: "G304"
      # kiln writes system config with Debian's standard modes (0644 files, 0755 dirs) on purpose;
      # secrets and state are created 0600 explicitly (D41).
      - linters: [gosec]
        text: "G301|G302|G306"
      # internal/sys is the single, audited place that runs commands (rule 3); argv is never shell-interpreted.
      - path: internal/(sys|runner|app)/
        linters: [gosec]
        text: "G204"
      # Check() turns read errors into "not done yet" on purpose: an unreadable file means the step must run.
      - path: internal/(steps|battery|thermal|mirrors)/
        linters: [nilerr]

formatters:
  enable:
    - gofmt
    - goimports
