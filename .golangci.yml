# golangci-lint v2. Static analysis is kiln's only mechanical check (D34).
version: "2"

run:
  timeout: 5m

linters:
  # "standard" = errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - bodyclose     # unclosed HTTP response bodies (mirrors, downloads)
    - errorlint     # errors.Is/As instead of == and type assertions
    - gosec         # command injection, file permissions, weak randomness
    - misspell
    - nilerr        # returning nil after checking err != nil
    - noctx         # HTTP requests without a context (every network call needs a timeout)
    - unconvert
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment # struct layout noise; readability wins here
    errcheck:
      check-type-assertions: true
  exclusions:
    rules:
      # kiln reads system paths by design (sysfs, /etc, /var/lib); paths never come from untrusted input.
      - linters: [gosec]
        text: "G304"
      # kiln writes system config with Debian's standard modes (0644 files, 0755 dirs) on purpose;
      # the log is created 0600 explicitly.
      - linters: [gosec]
        text: "G301|G302|G306"
      # Commands are argv lists, never shell-interpreted (CLAUDE.md).
      - path: internal/(run|detect|steps|tui)/
        linters: [gosec]
        text: "G204"
      # Detection treats unreadable files as "not present" on purpose.
      - path: internal/(detect|steps)/
        linters: [nilerr]

formatters:
  enable:
    - gofmt
    - goimports
