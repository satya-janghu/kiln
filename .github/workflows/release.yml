# Release on v* tags: static checks, GoReleaser to GitHub Releases, then GitHub Pages
# (install.sh at /kiln/i). Spec: docs/distribution.md, D14, D31. Tags are cut only
# after review sign-off (docs/review-process.md). There are no tests by design (D30/D34).
name: release

on:
  push:
    tags: ['v*']

# Least privilege: nothing by default; each job asks for only what it needs.
permissions: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Build (linux/amd64 static binary)
        run: make build

      - name: Build for darwin (development platform must compile)
        run: GOOS=darwin GOARCH=arm64 go build ./...

      - name: go vet (linux and darwin)
        run: |
          go vet ./...
          GOOS=darwin GOARCH=arm64 go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: shellcheck install.sh scripts/field-check.sh
        run: shellcheck install.sh scripts/field-check.sh

  goreleaser:
    needs: checks
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pages:
    needs: goreleaser
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Copy install.sh into the site (served as /kiln/i and /kiln/install.sh)
        run: |
          cp install.sh site/i
          cp install.sh site/install.sh

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
