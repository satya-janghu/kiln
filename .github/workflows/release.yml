# Release on v* tags: static checks, then GoReleaser to GitHub Releases (the
# binary, checksums.txt and install.sh). Spec: docs/distribution.md, D14.
# There are no tests by design (D30/D34).
name: release

on:
  push:
    tags: ['v*']

# Least privilege: nothing by default; each job asks for only what it needs.
permissions: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Build (linux/amd64 static binary)
        run: make build

      - name: Build for darwin (development platform must compile)
        run: GOOS=darwin GOARCH=arm64 go build ./...

      - name: go vet (linux and darwin)
        run: |
          go vet ./...
          GOOS=darwin GOARCH=arm64 go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: shellcheck install.sh
        run: shellcheck install.sh

  goreleaser:
    needs: checks
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
